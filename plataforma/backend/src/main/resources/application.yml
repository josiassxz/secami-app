spring:
  application:
    name: secami-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secami}
    username: ${DB_USER:josiassiqueira}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

# ---- Config específica da aplicação ----
secami:
  jwt:
    # Segredo HS256 — em produção vem de env/secret manager (mín. 32 bytes).
    secret: ${JWT_SECRET:troque-este-segredo-de-desenvolvimento-secami-0123456789}
    access-token-minutes: ${JWT_ACCESS_MIN:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
    issuer: secami-backend

  # Login é 100% e-mail/senha local (LDAP removido) — controla só se os
  # usuários de desenvolvimento (admin/gerente/... senha secami123) são
  # semeados no boot (ver DevDataSeeder).
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:true}

  timezone: America/Sao_Paulo

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5050}

  storage:
    base-path: ${STORAGE_BASE_PATH:./uploads}
    max-file-size-mb: ${STORAGE_MAX_FILE_MB:10}

  # Catracas da academia (sistema Accelero) — desligado por padrão (ACCELERO_ENABLED)
  # porque só é alcançável de dentro da rede do governo. Credenciais NUNCA
  # hardcoded aqui — vêm de env/secret manager.
  accelero:
    enabled: ${ACCELERO_ENABLED:false}
    base-url: ${ACCELERO_BASE:https://10.5.150.8}
    usuario: ${ACCELERO_USER:}
    senha: ${ACCELERO_PASS:}
    categoria-acesso-id: ${ACCELERO_CATEGORIA_ACESSO:1213819408}

  # Login com a conta do governo (AD via LDAPS) — desligado por padrão
  # (LDAP_ENABLED) porque só é alcançável de dentro da rede do governo. A
  # senha da conta de serviço NUNCA fica aqui: vem de env/secret manager.
  ldap:
    enabled: ${LDAP_ENABLED:false}
    url: ${LDAP_URL:ldaps://dc2-dcsrv05.goias.intra:636}
    base-dn: ${LDAP_BASE_DN:OU=ORGAOS,DC=goias,DC=intra}
    bind-dn: ${LDAP_BIND_DN:svc.academia.pplt@sistemas.goias.gov.br}
    bind-password: ${LDAP_BIND_PASSWORD:}
    login-attribute: ${LDAP_LOGIN_ATTR:sAMAccountName}
    cpf-attribute: ${LDAP_CPF_ATTR:description}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      # Idem: tenta abrir uma conexão SMTP real (localhost:1025/Mailpit) só pra
      # health-check — em dev o Mailpit nem sempre está rodando, e o envio real
      # (ReminderService) já trata falha de e-mail com try/catch próprio.
      enabled: false
