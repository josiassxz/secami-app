<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Logo 1 - Wordmark dark
    Conceito: estampa editorial. Fundo dark, REPS gigante em Space Grotesk
    extra bold, linha vermelha de marker em cima referenciando o lateral
    do tema do app, e label "SEM FIRULA" letterspaced em baixo.
    Funciona bem em app icon, hero, e impressao.
  -->
  <rect width="1024" height="1024" fill="#0A0A0B"/>

  <!-- Marker vermelho top-left (assina o mark) -->
  <rect x="160" y="320" width="64" height="8" fill="#EF4444"/>

  <!-- REPS wordmark -->
  <text x="160" y="600"
        font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-size="380"
        font-weight="900"
        letter-spacing="-22"
        fill="#FFFFFF">REPS</text>

  <!-- Tagline label -->
  <text x="160" y="700"
        font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-size="32"
        font-weight="700"
        letter-spacing="6"
        fill="#A1A1AA">SEM&#160;FIRULA</text>

  <!-- Footer mono detail -->
  <text x="160" y="864"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="24"
        font-weight="600"
        letter-spacing="2"
        fill="#71717A">V0.1&#160;&#160;·&#160;&#160;DIARIO DE TREINO TECNICO</text>
</svg>
